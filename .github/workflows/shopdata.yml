name: Build shop map

# Weekly: download the UK OpenStreetMap extract, pull out the shops and split them
# into small 0.5° area files the app downloads. Published to the `shopdata` branch.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/**"
      - ".github/workflows/shopdata.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q osmium-tool
          pip install osmium

      - name: Download UK map
        run: curl -sSfL --retry 3 -o uk.osm.pbf https://download.geofabrik.de/europe/united-kingdom-latest.osm.pbf

      - name: Keep only shops
        run: osmium tags-filter uk.osm.pbf nwr/shop nwr/amenity=pharmacy,fuel -o shops.osm.pbf --overwrite

      - name: Build area files
        run: python tools/build_shops.py shops.osm.pbf out

      - name: Publish
        run: |
          cd out
          git init -q -b shopdata
          git config user.name "Shop Nudge bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Shop map $(date -u +%F)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" shopdata
